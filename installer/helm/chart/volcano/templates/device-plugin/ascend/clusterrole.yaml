{{- if .Values.deviceplugin.ascend.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "update", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch", "update"]
{{- end }}