{{- if .Values.deviceplugin.ascend.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
    spec:
      priorityClassName: "system-node-critical"
      serviceAccountName: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
      containers:
        - image: {{ .Values.deviceplugin.ascend.image }}
          imagePullPolicy: {{ .Values.deviceplugin.ascend.imagePullPolicy | quote }}
          name: device-plugin
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 500Mi
              cpu: 500m
          args:
            - --config_file
            - /ascend-config.yaml
            - --is_hami_mode=false
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: pod-resource
              mountPath: /var/lib/kubelet/pod-resources
            - name: hiai-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: log-path
              mountPath: /var/log/mindx-dl/devicePlugin
            - name: tmp
              mountPath: /tmp
            - name: device-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resource
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: hiai-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: log-path
          hostPath:
            path: /var/log/mindx-dl/devicePlugin
            type: Directory
        - name: tmp
          hostPath:
            path: /tmp
        - name: device-config
          configMap:
            name:  hami-scheduler-device
      {{- if .Values.deviceplugin.ascend.nodeSelector }}
      nodeSelector: {{ toYaml .Values.deviceplugin.ascend.nodeSelector | nindent 8 }}
      {{- end }}
{{- end }}