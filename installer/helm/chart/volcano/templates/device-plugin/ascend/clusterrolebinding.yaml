{{- if .Values.deviceplugin.ascend.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
subjects:
  - kind: ServiceAccount
    name: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.deviceplugin.ascend.resourcePrefix | default "hami-device-plugin" }}-volcano-ascend
  apiGroup: rbac.authorization.k8s.io
{{- end }}